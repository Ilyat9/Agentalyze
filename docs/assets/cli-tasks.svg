  <text x="24" y="66" font-family="Menlo,Consolas,monospace" font-size="13"><tspan fill="#7ee787" font-weight="bold">$</tspan><tspan fill="#e6edf3"> agentalyze tasks</tspan></text><text x="24" y="87" font-family="Menlo,Consolas,monospace" font-size="13" fill="#79c0ff" font-weight="bold">18 registered tasks:</text><text x="24" y="108" font-family="Menlo,Consolas,monospace" font-size="13" fill="#79c0ff" font-weight="bold">  nav-simple-link-01           navigation      easy   Follow the documentation link</text><text x="24" y="129" font-family="Menlo,Consolas,monospace" font-size="13" fill="#79c0ff" font-weight="bold">  nav-dropdown-menu-02         navigation      medium Open item via two-level dropdown menu</text><text x="24" y="150" font-family="Menlo,Consolas,monospace" font-size="13" fill="#79c0ff" font-weight="bold">  nav-tabs-secret-03           navigation      hard   Find the archive tab</text><text x="24" y="171" font-family="Menlo,Consolas,monospace" font-size="13" fill="#79c0ff" font-weight="bold">  form-fill-basic-01           form_fill       easy   Fill the contact form</text><text x="24" y="192" font-family="Menlo,Consolas,monospace" font-size="13" fill="#79c0ff" font-weight="bold">  form-fill-validation-02      form_fill       medium Pass client-side validation on registration</text><text x="24" y="213" font-family="Menlo,Consolas,monospace" font-size="13" fill="#79c0ff" font-weight="bold">  form-fill-dependent-selects-03 form_fill       hard   Dependent country/city selects</text><text x="24" y="234" font-family="Menlo,Consolas,monospace" font-size="13" fill="#79c0ff" font-weight="bold">  extract-price-01             extraction      easy   Extract the product price</text><text x="24" y="255" font-family="Menlo,Consolas,monospace" font-size="13" fill="#79c0ff" font-weight="bold">  extract-date-02              extraction      medium Extract the conference date</text><text x="24" y="276" font-family="Menlo,Consolas,monospace" font-size="13" fill="#79c0ff" font-weight="bold">  extract-table-count-03       extraction      hard   Count qualifying orders in a table</text><text x="24" y="297" font-family="Menlo,Consolas,monospace" font-size="13" fill="#79c0ff" font-weight="bold">  multi-shop-checkout-01       multi_step      medium Add item to cart and check out</text><text x="24" y="318" font-family="Menlo,Consolas,monospace" font-size="13" fill="#79c0ff" font-weight="bold">  multi-wizard-02              multi_step      hard   Complete the three-step wizard</text><text x="24" y="339" font-family="Menlo,Consolas,monospace" font-size="13" fill="#79c0ff" font-weight="bold">  multi-settings-toggles-03    multi_step      medium Enable settings and save</text><text x="24" y="360" font-family="Menlo,Consolas,monospace" font-size="13" fill="#79c0ff" font-weight="bold">  err-retry-submit-01          error_recovery  easy   Retry after rejected submission</text><text x="24" y="381" font-family="Menlo,Consolas,monospace" font-size="13" fill="#79c0ff" font-weight="bold">  err-dead-end-02              error_recovery  hard   Recover from a dead-end link</text><text x="24" y="402" font-family="Menlo,Consolas,monospace" font-size="13" fill="#79c0ff" font-weight="bold">  err-flaky-widget-03          error_recovery  hard   Generate a flaky report</text><text x="24" y="423" font-family="Menlo,Consolas,monospace" font-size="13" fill="#79c0ff" font-weight="bold">  distractor-buttons-01        distractor      easy   Pick the real submit button</text><text x="24" y="444" font-family="Menlo,Consolas,monospace" font-size="13" fill="#79c0ff" font-weight="bold">  distractor-links-02          distractor      medium Find the genuine dashboard link</text><text x="24" y="465" font-family="Menlo,Consolas,monospace" font-size="13" fill="#79c0ff" font-weight="bold">  distractor-forms-03          distractor      hard   Use the working form</text><text x="24" y="507" font-family="Menlo,Consolas,monospace" font-size="13"><tspan fill="#7ee787" font-weight="bold">$</tspan><tspan fill="#e6edf3"> agentalyze compare --all-tasks --providers gpt-4o-mini-via-openrouter,llama31-8b-local</tspan></text><text x="24" y="528" font-family="Menlo,Consolas,monospace" font-size="13" fill="#d2a8ff">Running 36 task/provider combinations...</text>
