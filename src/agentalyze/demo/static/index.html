<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentalyze — живое демо (свой API-ключ)</title>
<style>
  :root {
    --bg: #070b14; --panel: rgba(255,255,255,.035); --panel2: rgba(255,255,255,.06);
    --border: rgba(255,255,255,.09); --border-hi: rgba(255,255,255,.18);
    --text: #eef2fb; --muted: #9aa7c4; --dim: #6b7899;
    --acc1: #6366f1; --acc2: #22d3ee; --grad: linear-gradient(135deg,#6366f1,#22d3ee);
    --ok: #34d399; --bad: #f87171;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; padding: 0 1rem 3rem; background: var(--bg); color: var(--text);
    font: 15.5px/1.6 'Inter', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(700px 420px at 15% -5%, rgba(99,102,241,.16), transparent 60%),
      radial-gradient(800px 500px at 90% 0%, rgba(34,211,238,.10), transparent 55%),
      radial-gradient(600px 600px at 50% 110%, rgba(99,102,241,.07), transparent 60%);
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: .9rem; padding: 2.6rem 0 .4rem; }
  .logo {
    width: 44px; height: 44px; flex: none; border-radius: 12px; background: var(--grad);
    display: grid; place-items: center; font-weight: 800; font-size: 1.25rem; color: #fff;
    box-shadow: 0 4px 24px rgba(99,102,241,.45);
  }
  h1 { font-size: 1.55rem; margin: 0; letter-spacing: -.02em; }
  h1 .grad {
    background: var(--grad); -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .sub { color: var(--muted); margin: .2rem 0 1.6rem; font-size: 1.02rem; }
  .langswitch { position: fixed; top: 16px; right: 18px; z-index: 10; display: flex; gap: 2px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
  .langswitch button {
    padding: .28rem .7rem; font-size: .78rem; font-weight: 700; letter-spacing: .04em;
    background: transparent; color: var(--muted); border: 0; border-radius: 999px; cursor: pointer;
    transition: all .15s;
  }
  .langswitch button.active { color: #fff; background: var(--grad); }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 1.4rem 1.5rem; margin-bottom: 1.1rem;
  }
  label { display: block; font-weight: 600; margin: 1.1rem 0 .35rem; font-size: .93rem; }
  label:first-child { margin-top: 0; }
  input[type="text"], input[type="password"], input[type="url"], select, textarea {
    width: 100%; padding: .62rem .8rem; border-radius: 10px; border: 1px solid var(--border);
    background: rgba(0,0,0,.30); color: var(--text); font-size: .95rem; font-family: inherit;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--acc1); box-shadow: 0 0 0 3px rgba(99,102,241,.18);
  }
  input[type="password"] { letter-spacing: 2px; }
  .hint { color: var(--dim); font-size: .8rem; margin-top: .3rem; }
  .hint code { background: rgba(255,255,255,.07); padding: .05rem .3rem; border-radius: 4px; }
  .notice {
    background: linear-gradient(180deg, rgba(99,102,241,.09), rgba(99,102,241,.035));
    border: 1px solid rgba(99,102,241,.30); border-radius: 16px; padding: 1.2rem 1.4rem;
    margin-bottom: 1.3rem; font-size: .93rem;
  }
  .notice .ntitle { display: flex; align-items: center; gap: .55rem; font-weight: 700; margin-bottom: .5rem; }
  .notice .ntitle svg { flex: none; }
  .notice ul { margin: 0; padding-left: 1.25rem; }
  .notice li { margin: .3rem 0; color: var(--muted); }
  .notice li strong { color: var(--text); }

  /* ---------- task tiles ---------- */
  .tiles { display: grid; gap: .6rem; }
  .tile { position: relative; }
  .tile > input { position: absolute; opacity: 0; pointer-events: none; }
  .tile > label {
    display: block; margin: 0; padding: .85rem 1rem; border: 1px solid var(--border);
    border-radius: 12px; cursor: pointer; transition: all .15s; background: rgba(0,0,0,.2);
  }
  .tile > label:hover { border-color: var(--border-hi); }
  .tile > input:checked + label {
    border-color: var(--acc1); background: rgba(99,102,241,.12);
    box-shadow: 0 0 0 1px var(--acc1), 0 4px 18px rgba(99,102,241,.15);
  }
  .tile .ttitle { font-weight: 600; display: flex; gap: .5rem; align-items: baseline; flex-wrap: wrap; }
  .tile .steps { color: var(--dim); font-size: .76rem; font-weight: 500; }
  .tile .badge {
    font-size: .66rem; padding: .1rem .5rem; border-radius: 999px; background: var(--grad);
    color: #fff; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  }
  .tile .desc { color: var(--muted); font-size: .83rem; margin-top: .15rem; }
  .tile textarea { margin-top: .65rem; resize: vertical; min-height: 70px; }
  .counter { text-align: right; font-size: .74rem; color: var(--dim); margin-top: .2rem; }

  /* ---------- consent + run ---------- */
  .consent { display: flex; gap: .65rem; align-items: flex-start; margin-top: 1.25rem; font-size: .88rem; color: var(--muted); }
  .consent input { margin-top: .22rem; accent-color: var(--acc1); width: 16px; height: 16px; flex: none; }
  .consent b { color: var(--text); }
  button.run {
    margin-top: 1.25rem; width: 100%; padding: .85rem; font-size: 1rem; font-weight: 700; color: #fff;
    background: var(--grad); border: 0; border-radius: 12px; cursor: pointer;
    box-shadow: 0 6px 24px rgba(99,102,241,.35); transition: transform .15s, box-shadow .15s, opacity .15s;
  }
  button.run:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 30px rgba(99,102,241,.5); }
  button.run:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; transform: none; }
  .spin {
    display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.35);
    border-top-color: #fff; border-radius: 50%; vertical-align: -2px; margin-right: .55rem;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- result ---------- */
  .status {
    display: inline-flex; align-items: center; gap: .45rem; font-weight: 700;
    padding: .5rem .95rem; border-radius: 999px; margin-bottom: .9rem; font-size: .92rem;
  }
  .status.ok { background: rgba(52,211,153,.12); color: var(--ok); border: 1px solid rgba(52,211,153,.35); }
  .status.bad { background: rgba(248,113,113,.10); color: var(--bad); border: 1px solid rgba(248,113,113,.30); }
  .status.wait { background: rgba(99,102,241,.12); color: #a5b4fc; border: 1px solid rgba(99,102,241,.40); }
  .chips { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: .9rem; }
  .chip {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 999px;
    padding: .3rem .85rem; font-size: .82rem; color: var(--muted);
  }
  .chip b { color: var(--text); font-weight: 600; }
  .vreason {
    font-size: .85rem; color: var(--muted); border-left: 3px solid var(--acc1);
    padding: .4rem .85rem; background: rgba(99,102,241,.06); border-radius: 0 8px 8px 0; margin-bottom: 1rem;
  }
  .timeline { position: relative; margin: .3rem 0 0 .5rem; padding-left: 1.35rem; }
  .tstep { position: relative; padding: .45rem 0 .45rem .4rem; font-size: .87rem; }
  .tstep::before {
    content: ''; position: absolute; left: -1.35rem; top: .95rem; width: 9px; height: 9px;
    border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(52,211,153,.15);
  }
  .tstep.fail::before { background: var(--bad); box-shadow: 0 0 0 3px rgba(248,113,113,.15); }
  .tstep::after {
    content: ''; position: absolute; left: -.95rem; top: 1.55rem; bottom: -.35rem;
    width: 1px; background: var(--border);
  }
  .tstep:last-child::after { display: none; }
  .tstep .act { font-weight: 600; }
  .tstep.fail .act { color: var(--bad); }
  .tstep .obs { color: var(--muted); font-size: .82rem; margin-top: .12rem; }
  .err { color: var(--bad); white-space: pre-wrap; }
  .foot { text-align: center; color: var(--dim); font-size: .8rem; margin-top: 2.2rem; }
  .foot a { color: var(--muted); }
  @media (max-width: 560px) { .card { padding: 1.1rem; } header { padding-top: 1.8rem; } }
</style>
</head>

<body>
<div class="langswitch">
  <button id="lang_ru">RU</button><button id="lang_en">EN</button>
</div>
<div class="wrap">

    <div class="logo">A</div>

  <div class="card">

    <input type="text" id="model" value="openai/gpt-4o-mini" autocomplete="off" spellcheck="false">
    <div class="hint" data-i18n="hint_model"></div>

    <label for="api_key" data-i18n="label_key"></label>
    <input type="password" id="api_key" placeholder="sk-or-v1-…" autocomplete="new-password" spellcheck="false">
    <div class="hint" data-i18n="hint_key"></div>

    <label data-i18n="label_tasks"></label>
    <div id="tasks" class="tiles"><span class="hint" data-i18n="tasks_loading"></span></div>

    <div class="consent">
      <input type="checkbox" id="consent">
      <span data-i18n="consent_text"></span>
    </div>

    <button class="run" id="run" disabled data-i18n="btn_run"></button>
  </div>

  <div class="card result" id="result_card" style="display:none">
    <div id="result"></div>
  </div>

  <footer class="foot">
    <span data-i18n="foot"></span><br>
    <a href="https://github.com/Ilyat9/Agentalyze" target="_blank" rel="noopener">github.com/Ilyat9/Agentalyze</a>
  </footer>
</div>

var lang = "ru";
try { lang = localStorage.getItem("demo_lang") === "en" ? "en" : "ru"; } catch (e) {}
var tasksData = [];
var lastData = null;
var customText = "";

function t(key) { return I18N[lang][key]; }

function applyLang() {
  document.documentElement.lang = lang;
  document.getElementById("lang_ru").className = lang === "ru" ? "active" : "";
  document.getElementById("lang_en").className = lang === "en" ? "active" : "";
  var els = document.querySelectorAll("[data-i18n]");
  for (var i = 0; i < els.length; i++) {
    var key = els[i].getAttribute("data-i18n");
    if (t(key) != null) { els[i].innerHTML = t(key); }
  }
  renderTasks();
  if (lastData) { render(lastData); }
}

document.getElementById("lang_ru").addEventListener("click", function () { lang = "ru"; try { localStorage.setItem("demo_lang", "ru"); } catch (e) {} applyLang(); });
document.getElementById("lang_en").addEventListener("click", function () { lang = "en"; try { localStorage.setItem("demo_lang", "en"); } catch (e) {} applyLang(); });

var sel = document.getElementById("base_url");
var custom = document.getElementById("base_url_custom");
sel.addEventListener("change", function () {
  custom.style.display = sel.value === "custom" ? "block" : "none";
});

function selectedTask() {
  var r = document.querySelector('input[name="task"]:checked');
  return r ? r.value : null;
}

function refresh() {
  var task = selectedTask();
  var ok = consent.checked && !!task;
  if (ok && task === "custom") {
    var ta = document.getElementById("custom_instructions");
    ok = ta && ta.value.trim().length > 0;
  }
  runBtn.disabled = !ok;
}
consent.addEventListener("change", refresh);

function makeTile(id, titleHtml, descHtml, extraHtml) {
  var tile = document.createElement("div");
  tile.className = "tile";
  var input = document.createElement("input");
  input.type = "radio"; input.name = "task"; input.value = id; input.id = "t_" + id;
  input.addEventListener("change", refresh);
  var label = document.createElement("label");
  label.setAttribute("for", "t_" + id);
  label.innerHTML = '<div class="ttitle">' + titleHtml + '</div>' +
    '<div class="desc">' + descHtml + '</div>' + (extraHtml || "");
  tile.appendChild(input);
  tile.appendChild(label);
  return tile;
}

function renderTasks() {
  var ta = document.getElementById("custom_instructions");
  if (ta) { customText = ta.value; }
  tasksBox.innerHTML = "";
  tasksData.forEach(function (task) {
    var loc = (I18N[lang].tasks || {})[task.id];
    var title = loc ? loc.t : task.title;
    var desc = loc ? loc.d : task.description;
    tasksBox.appendChild(makeTile(
      task.id,
      escapeHtml(title) + ' <span class="steps">(' + task.max_steps + " " + t("steps_suffix") + ")</span>",
      escapeHtml(desc)
    ));
  });
  var customExtra =
    '<textarea id="custom_instructions" rows="3" maxlength="500" spellcheck="false" placeholder="' +
    escapeHtml(t("custom_placeholder")) + '"></textarea>' +
    '<div class="counter"><span id="ccount">' + customText.length + '</span>/500</div>';
  var customTile = makeTile("custom", escapeHtml(t("custom_title")) +
    ' <span class="badge">' + t("custom_badge") + '</span>' +
    ' <span class="steps">(8 ' + t("steps_suffix") + ")</span>",
    t("custom_hint"), customExtra);
  tasksBox.appendChild(customTile);
  var ta2 = document.getElementById("custom_instructions");
  ta2.value = customText;
  ta2.addEventListener("input", function () {
    document.getElementById("ccount").textContent = ta2.value.length;
    refresh();
  });
  ta2.addEventListener("focus", function () {
    ta2.closest(".tile").querySelector("input").checked = true;
    refresh();
  });
}

fetch("/demo/tasks").then(function (r) { return r.json(); }).then(function (data) {
  tasksData = data.tasks || [];
  renderTasks();
}).catch(function () {
  tasksBox.innerHTML = '<span class="err">' + escapeHtml(t("tasks_error")) + "</span>";
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

runBtn.addEventListener("click", function () {
  var key = document.getElementById("api_key").value.trim();
  var model = document.getElementById("model").value.trim();
  var base = sel.value === "custom" ? custom.value.trim() : sel.value;
  var task = selectedTask();
  if (!key || !model || !task) { return; }

  var body = {
    provider_kind: "openai_compatible",
    base_url: base,
    api_key: key,
    model_name: model,
    task_id: task
  };
  if (task === "custom") {
    body.custom_instructions = document.getElementById("custom_instructions").value.trim();
  }

  runBtn.disabled = true;
  resultCard.style.display = "block";
  resultBox.innerHTML = '<span class="status wait"><span class="spin"></span>' +
    escapeHtml(t("running_wait")) + "</span><div class=\"hint\">" + escapeHtml(t("running")) + "</div>";
  resultBox.scrollIntoView({ behavior: "smooth", block: "nearest" });

  fetch("/demo/run", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  }).then(function (r) {
    return r.json().then(function (data) { return { data: data }; });
  }).then(function (res) {
    lastData = res.data;
    render(res.data);
  }).catch(function (err) {
    resultBox.innerHTML = '<span class="err">' + escapeHtml(t("network_err") + String(err)) + "</span>";
  }).finally(function () {
    runBtn.disabled = !consent.checked;
    document.getElementById("api_key").value = "";
  });
});

function render(data) {
  if (data.status === "completed" || data.status === "failed") {
    var good = data.status === "completed";
    var outcomeText = (I18N[lang].outcomes || {})[data.outcome] || data.outcome;
    var html = '<span class="status ' + (good ? "ok" : "bad") + '">' +
      escapeHtml((good ? t("st_completed") : t("st_failed")) + t("outcome_prefix") + outcomeText) +
      "</span>";
    html += '<div class="chips">' +
      chip(t("stats_steps"), data.step_count) +
      chip(t("stats_time"), data.wall_clock_seconds + "s") +
      chip(t("stats_tokens"), t("stats_tokens_fmt")
        .replace("{i}", data.total_prompt_tokens)
        .replace("{o}", data.total_completion_tokens)) +
      (data.total_cost_usd != null ? chip(t("stats_cost"), "$" + data.total_cost_usd.toFixed(4)) : "") +
      "</div>";
    if (data.verifier_reason) {
      html += '<div class="vreason"><b>' + escapeHtml(t("verifier")) + ':</b> ' +
        escapeHtml(data.verifier_reason) + "</div>";
    }
    if (data.task_id === "custom") {
      html += '<div class="hint" style="margin:.2rem 0 1rem">' + escapeHtml(t("custom_note")) + "</div>";
    }
    if ((data.steps || []).length) {
      html += '<div class="timeline">';
      data.steps.forEach(function (s) {
        html += '<div class="tstep' + (s.ok === false ? " fail" : "") + '"><span class="act">' +
          s.step + ". " + escapeHtml(s.action) + (s.ok === false ? " ✗" : "") + "</span>" +
          (s.observation ? '<div class="obs">' + escapeHtml(s.observation) + "</div>" : "") +
          "</div>";
      });
      html += "</div>";
    }
    resultBox.innerHTML = html;
  } else {
    var msg;
    if (data.status === "timeout") {
      msg = t("timeout_msg").replace("{n}", data.timeout_seconds || "90");
    } else if (data.error_kind) {
      var kindMap = {
        provider_auth: "err_auth",
        provider_timeout: "err_timeout",
        provider_connection: "err_connection",
        provider_error: "err_provider"
      };
      msg = kindMap[data.error_kind] ? t(kindMap[data.error_kind]) : (data.message || "");
    } else {
      msg = data.message || data.detail || JSON.stringify(data);
    }
    var statusKey = { timeout: "st_timeout", error: "st_error" }[data.status] || "st_error";
    resultBox.innerHTML = '<span class="status bad">' + escapeHtml(t(statusKey)) + "</span>" +
      '<div class="err">' + escapeHtml(msg) + "</div>";
  }
}

function chip(label, value) {
  return '<span class="chip">' + escapeHtml(label) + ": <b>" + escapeHtml(value) + "</b></span>";
}

applyLang();
</script>
</body>
</html>
