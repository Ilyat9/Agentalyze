<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentalyze — живое демо (свой API-ключ)</title>
<style>
  :root {
    --bg: #ffffff; --subtle: #f6f8fa; --border: #d1d9e0; --border-muted: #e7ecf0;
    --fg: #1f2328; --muted: #59636e; --dim: #818b98;
    --accent: #0969da; --green: #1a7f37; --red: #d1242f;
    --btn: #1f883d; --btn-hover: #1a7f37;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 1rem 3rem; background: var(--bg); color: var(--fg);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  /* header */
  .topbar { border-bottom: 1px solid var(--border-muted); padding: .8rem 0; margin-bottom: 1.6rem; }
  .topbar .inner { display: flex; align-items: center; justify-content: space-between; }
  .wordmark { display: flex; align-items: baseline; gap: .5rem; font-weight: 600; font-size: 15px; }
  .wordmark .tag {
    font-size: 11px; font-weight: 500; color: var(--muted); border: 1px solid var(--border);
    border-radius: 999px; padding: 0 .5rem; line-height: 18px;
  }
  .langswitch { display: flex; gap: .25rem; }
  .langswitch button {
    padding: .15rem .5rem; font-size: 12px; color: var(--muted); background: none;
    border: 1px solid transparent; border-radius: 6px; cursor: pointer;
  }
  .langswitch button:hover { color: var(--fg); }
  .langswitch button.active { color: var(--fg); border-color: var(--border); background: var(--subtle); }

  h1 { font-size: 20px; font-weight: 600; margin: 1.2rem 0 .3rem; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 0 0 1.4rem; }

  /* notice (GitHub-style callout) */
  .notice {
    background: var(--subtle); border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 6px; padding: .9rem 1.1rem; margin-bottom: 1.4rem; font-size: 13px; color: var(--muted);
  }
  .notice .ntitle { font-weight: 600; color: var(--fg); margin-bottom: .4rem; }
  .notice ul { margin: 0; padding-left: 1.2rem; }
  .notice li { margin: .25rem 0; }
  .notice strong { color: var(--fg); }

  /* form */
  .card {
    border: 1px solid var(--border); border-radius: 6px; padding: 1.1rem 1.2rem; margin-bottom: 1.2rem;
  }
  .card > h2 {
    font-size: 14px; font-weight: 600; margin: -1.1rem -1.2rem 1rem; padding: .7rem 1.2rem;
    border-bottom: 1px solid var(--border-muted); background: var(--subtle);
    border-radius: 6px 6px 0 0;
  }
  label { display: block; font-weight: 600; margin: 1rem 0 .3rem; font-size: 13px; }
  label:first-of-type { margin-top: 0; }
  input[type="text"], input[type="password"], input[type="url"], select, textarea {
    width: 100%; padding: .4rem .65rem; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--fg); font-size: 13px; font-family: inherit; outline: none;
    transition: border-color .1s;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px rgba(9,105,218,.12);
  }
  input[type="password"] { letter-spacing: 1.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .hint { color: var(--muted); font-size: 12px; margin-top: .3rem; }
  .hint code {
    background: var(--subtle); border: 1px solid var(--border-muted); border-radius: 4px;
    padding: 0 .3rem; font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  /* task rows (settings-list style) */
  .tiles { display: grid; gap: .5rem; }
  .tile { position: relative; }
  .tile > input { position: absolute; opacity: 0; pointer-events: none; }
  .tile > label {
    display: block; margin: 0; padding: .6rem .8rem; border: 1px solid var(--border);
    border-radius: 6px; cursor: pointer; transition: background .1s, border-color .1s;
  }
  .tile > label:hover { background: var(--subtle); }
  .tile > input:checked + label {
    border-color: var(--accent); background: #f3f8ff;
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .tile .ttitle { font-weight: 600; font-size: 13px; display: flex; gap: .45rem; align-items: baseline; flex-wrap: wrap; }
  .tile .steps { color: var(--dim); font-size: 11px; font-weight: 400; }
  .tile .badge {
    font-size: 10px; font-weight: 500; color: var(--accent); border: 1px solid var(--border);
    border-radius: 999px; padding: 0 .45rem; line-height: 16px; text-transform: uppercase; letter-spacing: .03em;
  }
  .tile .desc { color: var(--muted); font-size: 12px; margin-top: .1rem; }
  .tile textarea { margin-top: .55rem; resize: vertical; min-height: 62px;
    font-family: inherit; }
  .counter { text-align: right; font-size: 11px; color: var(--dim); margin-top: .15rem; }

  /* consent + run */
  .consent { display: flex; gap: .55rem; align-items: flex-start; margin-top: 1.1rem; font-size: 12.5px; color: var(--muted); }
  .consent input { margin-top: .18rem; accent-color: var(--accent); width: 14px; height: 14px; flex: none; }
  .consent b { color: var(--fg); }
  button.run {
    margin-top: 1.1rem; width: 100%; padding: .5rem; font-size: 14px; font-weight: 500; color: #fff;
    background: var(--btn); border: 1px solid rgba(31,35,40,.15); border-radius: 6px; cursor: pointer;
    transition: background .12s;
  }
  button.run:hover:not(:disabled) { background: var(--btn-hover); }
  button.run:disabled { opacity: .55; cursor: not-allowed; }
  .spin {
    display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,.35);
    border-top-color: #fff; border-radius: 50%; vertical-align: -2px; margin-right: .5rem;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* result */
  .status {
    display: inline-flex; align-items: center; gap: .45rem; font-weight: 600; font-size: 14px;
    margin-bottom: .7rem;
  }
  .status .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .status.ok { color: var(--green); } .status.ok .dot { background: var(--green); }
  .status.bad { color: var(--red); } .status.bad .dot { background: var(--red); }
  .status.wait { color: var(--muted); } .status.wait .dot { background: var(--dim); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .meta { color: var(--muted); font-size: 12px; margin-bottom: .8rem; }
  .meta b { color: var(--fg); font-weight: 600; }
  .meta span { margin-right: 1.2rem; white-space: nowrap; display: inline-block; }
  .vreason {
    font-size: 12.5px; color: var(--muted); border: 1px solid var(--border-muted);
    border-left: 3px solid var(--border); background: var(--subtle);
    padding: .45rem .8rem; border-radius: 0 6px 6px 0; margin-bottom: 1rem;
  }
  .steps-head {
    font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase;
    letter-spacing: .04em; margin: .8rem 0 .3rem;
  }
  table.steps { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.steps th, table.steps td { text-align: left; padding: .4rem .55rem; border-bottom: 1px solid var(--border-muted); vertical-align: top; }
  table.steps th { color: var(--muted); font-weight: 600; font-size: 11.5px; background: var(--subtle); }
  table.steps td.num { color: var(--dim); width: 2rem; }
  table.steps td.act { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; white-space: nowrap; }
  table.steps td.act .fail { color: var(--red); font-weight: 600; }
  table.steps td.obs { color: var(--muted); }
  .err { color: var(--red); white-space: pre-wrap; font-size: 13px; }
  .foot { color: var(--dim); font-size: 12px; margin-top: 2rem; text-align: center; }
  .foot a { color: var(--muted); }
  @media (max-width: 560px) { .card { padding: .9rem; } .card > h2 { margin: -.9rem -.9rem 1rem; padding: .6rem .9rem; } }
</style>
</head>

<body>
<div class="topbar">
  <div class="wrap inner">
    <div class="wordmark">Agentalyze <span class="tag">live demo</span></div>
    <div class="langswitch">
      <button id="lang_ru">RU</button><button id="lang_en">EN</button>
    </div>
  </div>
</div>
<div class="wrap">
  <h1 data-i18n="h1"></h1>
  <p class="sub" data-i18n="sub"></p>

  <div class="notice">
    <div class="ntitle" data-i18n="notice_title"></div>
    <ul>
      <li data-i18n="notice_1"></li>
      <li data-i18n="notice_2"></li>
      <li data-i18n="notice_3"></li>
      <li data-i18n="notice_4"></li>
      <li data-i18n="notice_5"></li>
    </ul>
  </div>

  <div class="card">
    <h2 data-i18n="card_form"></h2>
    <label for="base_url" data-i18n="label_endpoint"></label>
    <select id="base_url">
      <option value="https://openrouter.ai/api/v1" selected>OpenRouter (openrouter.ai)</option>
      <option value="https://api.openai.com/v1">OpenAI (api.openai.com)</option>
      <option value="custom" data-i18n="option_custom"></option>
    </select>
    <input type="url" id="base_url_custom" placeholder="https://…/v1" style="display:none;margin-top:.5rem">
    <div class="hint" data-i18n="hint_endpoint"></div>

    <label for="model" data-i18n="label_model"></label>
    <input type="text" id="model" value="openai/gpt-4o-mini" autocomplete="off" spellcheck="false">
    <div class="hint" data-i18n="hint_model"></div>

    <label for="api_key" data-i18n="label_key"></label>
    <input type="password" id="api_key" placeholder="sk-or-v1-…" autocomplete="new-password" spellcheck="false">
    <div class="hint" data-i18n="hint_key"></div>

    <label data-i18n="label_tasks"></label>
    <div id="tasks" class="tiles"><span class="hint" data-i18n="tasks_loading"></span></div>

    <div class="consent">
      <input type="checkbox" id="consent">
      <span data-i18n="consent_text"></span>
    </div>

    <button class="run" id="run" disabled data-i18n="btn_run"></button>
  </div>

  <div class="card" id="result_card" style="display:none">
    <h2 data-i18n="card_result"></h2>
    <div id="result"></div>
  </div>

  <footer class="foot">
    <span data-i18n="foot"></span> ·
    <a href="https://github.com/Ilyat9/Agentalyze" target="_blank" rel="noopener">GitHub</a>
  </footer>
</div>
<script>

var I18N = {

    btn_run: "Запустить",

    timeout_msg: "Прогон не уложился в {n} секунд и был остановлен. Это ограничение демо, не обязательно провал модели.",

    tasks: {
      "nav-simple-link-01": { t: "Перейти по ссылке в документацию", d: "Открой стартовую страницу портала Acme. Найди ссылку в раздел Documentation и перейди по ней." },
      "form-fill-basic-01": { t: "Заполнить контактную форму", d: "Заполни форму обратной связи: имя «Ivan Petrov», email «ivan@example.com», сообщение «My order has not arrived». Отправь." },
      "extract-price-01": { t: "Найти цену товара", d: "Найди цену «Nordic Chair». Запиши ответ в поле Answer числом в долларах (например 12.34) с уверенностью 0–1 и отправь." }
    },
    foot: "Agentalyze — открытый бенчмарк-харнесс для браузерных агентов"
  },
  en: {
    h1: "Run a browser agent with your own API key",
    sub: "A real headless Chromium executes the task on a benchmark site; your model makes the decisions. Works with an OpenRouter or any OpenAI-compatible key.",
    card_form: "Run configuration",
    card_result: "Result",
    notice_title: "How your API key is handled",
    notice_1: "The key is sent over <strong>HTTPS</strong> to this server <strong>only when you press “Run”</strong>. Never stored in your browser (no localStorage, no cookies).",

    label_endpoint: "Provider endpoint (OpenAI-compatible)",
    option_custom: "Custom base URL…",
    hint_endpoint: "Cloud OpenAI-compatible endpoints only (Ollama is unreachable from an anonymous server).",
    label_model: "Model",
    hint_model: "e.g. <code>openai/gpt-4o-mini</code> (OpenRouter) or <code>gpt-4o-mini</code> (OpenAI). Tool calling required.",
    label_key: "API key",
    hint_key: "Sent only with the “Run” request; never stored.",
    label_tasks: "Task",
    tasks_loading: "Loading tasks…",
    tasks_error: "Could not load the task list.",
    steps_suffix: "steps max",
    custom_title: "Your own task",
    custom_badge: "custom",
    custom_hint: "Describe the goal in plain words — the agent will attempt it on the demo portal page.",
    custom_placeholder: "e.g. find the “Privacy Policy” link on the page and follow it",
    custom_note: "For a custom task, success is the agent’s own verdict (self-reported): no objective DOM check exists for an arbitrary goal. The step table shows what actually happened.",

    running_wait: "Running…",
    running: "A real browser agent is on it — usually 15–90 seconds (first run after idle: up to a minute).",
    st_completed: "Success",
    st_failed: "Not solved",
    st_timeout: "Timed out",
    st_error: "Error",
    outcome_prefix: " — ",
    stats_steps: "Steps", stats_time: "Wall time", stats_tokens: "Tokens", stats_cost: "Cost",

    verifier: "Verifier",
    steps_list: "Run steps",
    network_err: "Network error: ",
    err_auth: "The provider rejected the API key (401/403). Check the key and model access.",
    err_timeout: "The provider did not answer in time. Try again or pick a faster model.",
    err_connection: "Could not reach the provider endpoint. Check the base URL (must be publicly reachable over HTTPS).",
    err_provider: "The provider returned an error during the run.",
    timeout_msg: "The run did not finish within {n} seconds and was stopped. This is a demo limit, not necessarily a model failure.",
    outcomes: {
      success: "success",
      failure_verifier: "agent declared done, verifier disagreed",
      failure_max_steps: "step budget exhausted",
      failure_timeout: "timed out",
      failure_provider_error: "provider error",

var consent = document.getElementById("consent");
var runBtn = document.getElementById("run");
var tasksBox = document.getElementById("tasks");
var resultCard = document.getElementById("result_card");
var resultBox = document.getElementById("result");

var lang = "ru";
try { lang = localStorage.getItem("demo_lang") === "en" ? "en" : "ru"; } catch (e) {}
var tasksData = [];
var lastData = null;
var customText = "";

function t(key) { return I18N[lang][key]; }

function applyLang() {
  document.documentElement.lang = lang;
  document.getElementById("lang_ru").className = lang === "ru" ? "active" : "";
  document.getElementById("lang_en").className = lang === "en" ? "active" : "";
  var els = document.querySelectorAll("[data-i18n]");
  for (var i = 0; i < els.length; i++) {
    var key = els[i].getAttribute("data-i18n");
    if (t(key) != null) { els[i].innerHTML = t(key); }
  }
  renderTasks();
  if (lastData) { render(lastData); }
}

document.getElementById("lang_ru").addEventListener("click", function () { lang = "ru"; try { localStorage.setItem("demo_lang", "ru"); } catch (e) {} applyLang(); });
document.getElementById("lang_en").addEventListener("click", function () { lang = "en"; try { localStorage.setItem("demo_lang", "en"); } catch (e) {} applyLang(); });

var sel = document.getElementById("base_url");
var custom = document.getElementById("base_url_custom");
sel.addEventListener("change", function () {
  custom.style.display = sel.value === "custom" ? "block" : "none";
});

function selectedTask() {
  var r = document.querySelector('input[name="task"]:checked');
  return r ? r.value : null;
}

function refresh() {
  var task = selectedTask();
  var ok = consent.checked && !!task;
  if (ok && task === "custom") {
    var ta = document.getElementById("custom_instructions");
    ok = ta && ta.value.trim().length > 0;
  }
  runBtn.disabled = !ok;
}
consent.addEventListener("change", refresh);

function makeTile(id, titleHtml, descHtml, extraHtml) {
  var tile = document.createElement("div");
  tile.className = "tile";
  var input = document.createElement("input");
  input.type = "radio"; input.name = "task"; input.value = id; input.id = "t_" + id;
  input.addEventListener("change", refresh);
  var label = document.createElement("label");
  label.setAttribute("for", "t_" + id);
  label.innerHTML = '<div class="ttitle">' + titleHtml + '</div>' +
    '<div class="desc">' + descHtml + '</div>' + (extraHtml || "");
  tile.appendChild(input);
  tile.appendChild(label);
  return tile;
}

function renderTasks() {
  var ta = document.getElementById("custom_instructions");
  if (ta) { customText = ta.value; }
  tasksBox.innerHTML = "";
  tasksData.forEach(function (task) {
    var loc = (I18N[lang].tasks || {})[task.id];
    var title = loc ? loc.t : task.title;
    var desc = loc ? loc.d : task.description;
    tasksBox.appendChild(makeTile(
      task.id,
      escapeHtml(title) + ' <span class="steps">(' + task.max_steps + " " + t("steps_suffix") + ")</span>",
      escapeHtml(desc)
    ));
  });
  var customExtra =
    '<textarea id="custom_instructions" rows="3" maxlength="500" spellcheck="false" placeholder="' +
    escapeHtml(t("custom_placeholder")) + '"></textarea>' +
    '<div class="counter"><span id="ccount">' + customText.length + '</span>/500</div>';
  tasksBox.appendChild(makeTile("custom", escapeHtml(t("custom_title")) +
    ' <span class="badge">' + t("custom_badge") + '</span>' +
    ' <span class="steps">(8 ' + t("steps_suffix") + ")</span>",
    t("custom_hint"), customExtra));
  var ta2 = document.getElementById("custom_instructions");
  ta2.value = customText;
  ta2.addEventListener("input", function () {
    document.getElementById("ccount").textContent = ta2.value.length;
    refresh();
  });
  ta2.addEventListener("focus", function () {
    ta2.closest(".tile").querySelector("input").checked = true;
    refresh();
  });
}

fetch("/demo/tasks").then(function (r) { return r.json(); }).then(function (data) {
  tasksData = data.tasks || [];
  renderTasks();
}).catch(function () {
  tasksBox.innerHTML = '<span class="err">' + escapeHtml(t("tasks_error")) + "</span>";
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

runBtn.addEventListener("click", function () {
  var key = document.getElementById("api_key").value.trim();
  var model = document.getElementById("model").value.trim();
  var base = sel.value === "custom" ? custom.value.trim() : sel.value;
  var task = selectedTask();
  if (!key || !model || !task) { return; }

  var body = {
    provider_kind: "openai_compatible",
    base_url: base,
    api_key: key,
    model_name: model,
    task_id: task
  };
  if (task === "custom") {
    body.custom_instructions = document.getElementById("custom_instructions").value.trim();
  }

  runBtn.disabled = true;
  resultCard.style.display = "block";
  resultBox.innerHTML = '<div class="status wait"><span class="dot"></span>' +
    escapeHtml(t("running_wait")) + '</div><div class="hint">' + escapeHtml(t("running")) + "</div>";
  resultBox.scrollIntoView({ behavior: "smooth", block: "nearest" });

  fetch("/demo/run", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  }).then(function (r) {
    return r.json().then(function (data) { return { data: data }; });
  }).then(function (res) {
    lastData = res.data;
    render(res.data);
  }).catch(function (err) {
    resultBox.innerHTML = '<div class="err">' + escapeHtml(t("network_err") + String(err)) + "</div>";
  }).finally(function () {
    runBtn.disabled = !consent.checked;
    document.getElementById("api_key").value = "";
  });
});

function render(data) {
  if (data.status === "completed" || data.status === "failed") {
    var good = data.status === "completed";
    var outcomeText = (I18N[lang].outcomes || {})[data.outcome] || data.outcome;
    var html = '<div class="status ' + (good ? "ok" : "bad") + '"><span class="dot"></span>' +
      escapeHtml((good ? t("st_completed") : t("st_failed")) + t("outcome_prefix") + outcomeText) +
      "</div>";
    html += '<div class="meta">' +
      "<span>" + t("stats_steps") + ": <b>" + data.step_count + "</b></span>" +
      "<span>" + t("stats_time") + ": <b>" + data.wall_clock_seconds + "s</b></span>" +
      "<span>" + t("stats_tokens") + ": <b>" +
        escapeHtml(t("stats_tokens_fmt")
          .replace("{i}", data.total_prompt_tokens)
          .replace("{o}", data.total_completion_tokens)) + "</b></span>" +
      (data.total_cost_usd != null ? "<span>" + t("stats_cost") + ": <b>$" + data.total_cost_usd.toFixed(4) + "</b></span>" : "") +
      "</div>";
    if (data.verifier_reason) {
      html += '<div class="vreason"><b>' + escapeHtml(t("verifier")) + ":</b> " +
        escapeHtml(data.verifier_reason) + "</div>";
    }
    if (data.task_id === "custom") {
      html += '<div class="hint" style="margin:.2rem 0 1rem">' + escapeHtml(t("custom_note")) + "</div>";
    }
    if ((data.steps || []).length) {
      html += '<div class="steps-head">' + escapeHtml(t("steps_list")) + "</div>";
      html += '<table class="steps"><tr><th>#</th><th>' + escapeHtml(t("stats_steps")) +
        '</th><th></th></tr>';
      data.steps.forEach(function (s) {
        html += '<tr><td class="num">' + s.step + '</td><td class="act">' + escapeHtml(s.action) +
          (s.ok === false ? ' <span class="fail">✗</span>' : "") +
          '</td><td class="obs">' + escapeHtml(s.observation || "") + "</td></tr>";
      });
      html += "</table>";
    }
    resultBox.innerHTML = html;
  } else {
    var msg;
    if (data.status === "timeout") {
      msg = t("timeout_msg").replace("{n}", data.timeout_seconds || "90");
    } else if (data.error_kind) {
      var kindMap = {
        provider_auth: "err_auth",
        provider_timeout: "err_timeout",
        provider_connection: "err_connection",
        provider_error: "err_provider"
      };
      msg = kindMap[data.error_kind] ? t(kindMap[data.error_kind]) : (data.message || "");
    } else {
      msg = data.message || data.detail || JSON.stringify(data);
    }
    var statusKey = { timeout: "st_timeout", error: "st_error" }[data.status] || "st_error";
    resultBox.innerHTML = '<div class="status bad"><span class="dot"></span>' + escapeHtml(t(statusKey)) +
      '</div><div class="err">' + escapeHtml(msg) + "</div>";
  }
}

applyLang();
</script>
</body>
</html>
