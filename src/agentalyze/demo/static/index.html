<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentalyze — live demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #f7f5f0;
    --ink: #1c1b19;
    --ink-soft: #4a4844;
    --ink-faint: #8a877e;
    --line: #d8d4c8;
    --line-strong: #1c1b19;
    --moss: #3d5c47;
    --moss-bg: #e7ebe3;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'IBM Plex Sans', -apple-system, sans-serif;
    --serif: 'Source Serif 4', Georgia, serif;
  }
  html[data-theme="dark"]{
    --paper: #16150f;
    --ink: #eeece4;
    --ink-soft: #b6b2a6;
    --ink-faint: #78756a;
    --line: #322f26;
    --line-strong: #eeece4;
    --moss: #9ab89e;
    --moss-bg: #232a24;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    transition: background .2s ease, color .2s ease;
  }
  a{color:inherit;}
  ::selection{ background: var(--ink); color: var(--paper); }

  /* ---------- topbar ---------- */
  .topbar{ border-bottom: 1px solid var(--line-strong); }
  .topbar-inner{
    max-width: 1040px; margin: 0 auto; padding: 22px 32px;
    display:flex; align-items: baseline; justify-content: space-between;
  }
  .brand{ display:flex; align-items: baseline; gap: 10px; }
  .brand-name{ font-family: var(--serif); font-weight: 600; font-size: 19px; letter-spacing: -0.01em; }
  .brand-tag{ font-family: var(--mono); font-size: 11px; color: var(--ink-faint); letter-spacing: 0.02em; }
  .topbar-right{ display:flex; align-items: baseline; gap: 26px; }
  .lang-switch{ display:flex; gap: 18px; font-family: var(--mono); font-size: 12px; }
  .lang-switch span{ color: var(--ink-faint); cursor: pointer; }
  .lang-switch span.active{ color: var(--ink); border-bottom: 1px solid var(--ink); padding-bottom: 2px; }
  .theme-toggle{
    background: none; border: 1px solid var(--line-strong); color: var(--ink);
    font-family: var(--mono); font-size: 11.5px; padding: 5px 11px; cursor: pointer;
    letter-spacing: 0.02em;
  }
  .theme-toggle:hover{ background: var(--ink); color: var(--paper); }

  /* ---------- layout ---------- */
  .wrap{ max-width: 1040px; margin: 0 auto; padding: 56px 32px 80px; }
  .hero-grid{
    display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 56px;
    align-items: start; margin-bottom: 56px;
  }
  @media (max-width: 900px){ .hero-grid{ grid-template-columns: 1fr; gap: 36px; } }
  .hero{ max-width: 600px; }
  .status-line{
    display:flex; align-items:center; gap: 9px; margin-top: 20px;
    font-family: var(--mono); font-size: 12px; color: var(--ink-faint);
  }
  .status-line .dot{ width: 8px; height: 8px; border-radius: 50%; background: var(--ink-faint); flex: none; }
  .status-line.up{ color: var(--ink-soft); }
  .status-line.up .dot{ background: var(--moss); }
  .status-line.warn .dot{ background: #b08a3e; }

  /* ---------- hero preview terminal (illustrative loop, clearly labeled) ---------- */
  .hero-preview{
    position: sticky; top: 24px; border: 1px solid var(--line-strong);
    background: var(--paper); display: flex; flex-direction: column;
  }
  @media (max-width: 900px){ .hero-preview{ position: static; } }
  .hero-preview-head{
    padding: 12px 18px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
  }
  .hero-preview-head .label{
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.03em;
    text-transform: uppercase; color: var(--ink-faint);
  }
  .hero-preview-head .rec{
    font-family: var(--mono); font-size: 11px; color: var(--moss);
    display: flex; align-items: center; gap: 7px;
  }
  .hero-preview-head .rec::before{
    content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--moss);
    animation: rec-pulse 1.6s ease-in-out infinite;
  }
  @keyframes rec-pulse{ 50%{ opacity: .25; } }
  .hero-preview-body{ padding: 16px 18px 18px; font-family: var(--mono); font-size: 12px; min-height: 262px; }
  .hero-preview-line{
    padding: 6px 0; border-bottom: 1px solid var(--line); color: var(--ink-soft);
    opacity: 0; animation: preview-in .3s ease forwards;
  }
  .hero-preview-line:last-child{ border-bottom: none; }
  .hero-preview-line .t{ color: var(--ink-faint); margin-right: 9px; }
  .hero-preview-line .tag{
    color: var(--ink-faint); text-transform: uppercase; font-size: 10px;
    margin-right: 9px; letter-spacing: 0.03em;
  }
  .hero-preview-line b{ color: var(--ink); font-weight: 500; }
  .hero-preview-line .sel{ color: var(--moss); }
  @keyframes preview-in{ from{ opacity: 0; transform: translateY(3px); } to{ opacity: 1; transform: translateY(0); } }
  .hero-preview-foot{
    padding: 11px 18px; border-top: 1px solid var(--line);
    font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint);
  }
  .kicker{
    font-family: var(--mono); font-size: 11.5px; color: var(--moss);
    letter-spacing: 0.03em; margin-bottom: 18px; text-transform: uppercase;
  }
  h1{
    font-family: var(--serif); font-size: clamp(30px, 4.2vw, 44px); font-weight: 600;
    letter-spacing: -0.015em; line-height: 1.16; margin-bottom: 22px;
  }
  .lede{ color: var(--ink-soft); font-size: 17px; line-height: 1.65; max-width: 560px; }
  .lede strong{ color: var(--ink); font-weight: 600; }

  /* ---------- trust panel ---------- */
  .trust{
    background: var(--moss-bg); border: 1px solid var(--line); border-left: 3px solid var(--moss);
    padding: 30px 36px; margin-bottom: 48px;
  }
  .trust-head{
    font-family: var(--mono); font-size: 12px; font-weight: 500; text-transform: uppercase;
    letter-spacing: 0.04em; color: var(--moss); margin-bottom: 20px;
  }
  .trust-list{ list-style:none; display:grid; grid-template-columns: 1fr 1fr; gap: 20px 48px; }
  .trust-list li{
    font-size: 14px; color: var(--ink-soft); line-height: 1.6; padding-left: 18px;
    border-left: 1px solid var(--line);
  }
  .trust-list li strong{ color: var(--ink); font-weight: 600; }
  .trust-list li code{
    font-family: var(--mono); font-size: 12.5px; background: var(--paper);
    border: 1px solid var(--line); padding: 1px 5px; border-radius: 2px; color: var(--moss);
  }
  @media (max-width: 720px){ .trust-list{ grid-template-columns: 1fr; } }

  /* ---------- console: two columns ---------- */
  .console-label{
    font-family: var(--mono); font-size: 11.5px; color: var(--ink-faint);
    text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 12px;
  }
  .console{ display:grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line-strong); }
  @media (max-width: 900px){ .console{ grid-template-columns: 1fr; } }
  .panel{ display:flex; flex-direction: column; }
  .panel + .panel{ border-left: 1px solid var(--line-strong); }
  @media (max-width: 900px){ .panel + .panel{ border-left:none; border-top: 1px solid var(--line-strong); } }
  .panel-head{
    padding: 14px 22px; border-bottom: 1px solid var(--line-strong); background: var(--moss-bg);
    font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: 0.01em;
  }

  /* --- config form --- */
  .panel-body{ padding: 26px 22px; }
  .field{ margin-bottom: 22px; }
  .field:last-child{ margin-bottom:0; }
  .field label{ display:block; font-size: 13px; font-weight: 500; color: var(--ink); margin-bottom: 8px; }
  .field .hint{ font-size: 12.5px; color: var(--ink-faint); margin-top: 7px; line-height: 1.5; }
  .field .hint code{
    font-family: var(--mono); font-size: 12px; background: var(--paper);
    border: 1px solid var(--line); padding: 0 4px; border-radius: 2px;
  }
  select, input[type="text"], input[type="password"], input[type="url"], textarea{
    width: 100%; background: var(--paper); border: 1px solid var(--line-strong); border-radius: 0;
    color: var(--ink); padding: 10px 12px; font-family: var(--mono); font-size: 13px; outline: none;
    appearance: none; transition: background .2s ease, border-color .2s ease, color .2s ease;
  }
  select:focus, input:focus, textarea:focus{ outline: 2px solid var(--ink); outline-offset: -1px; }
  select{
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6' fill='none'><path d='M1 1L5 5L9 1' stroke='%231c1b19' stroke-width='1.3' stroke-linecap='round'/></svg>");
    background-repeat: no-repeat; background-position: right 13px center;
    padding-right: 32px; cursor: pointer;
  }
  html[data-theme="dark"] select{
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6' fill='none'><path d='M1 1L5 5L9 1' stroke='%23eeece4' stroke-width='1.3' stroke-linecap='round'/></svg>");
  }
  .key-field{ position: relative; }
  .key-field input{ padding-right: 66px; }
  .key-field .toggle{
    position: absolute; right: 0; top: 0; bottom: 0; background: transparent; border: none;
    border-left: 1px solid var(--line-strong); color: var(--ink-soft); font-family: var(--mono);
    font-size: 11px; padding: 0 12px; cursor:pointer;
  }
  .task-input{
    width:100%; background: var(--paper); border: 1px solid var(--line-strong); color: var(--ink);
    font-family: var(--sans); font-size: 13.5px; padding: 12px 13px; resize: vertical;
    min-height: 64px; outline:none; display:none;
  }
  .task-input:focus{ outline: 2px solid var(--ink); outline-offset: -1px; }
  .run-btn{
    width:100%; margin-top: 4px; background: var(--ink); color: var(--paper);
    border: 1px solid var(--ink); border-radius: 0; padding: 12px 18px;
    font-family: var(--sans); font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .run-btn:hover:not(:disabled){ opacity: 0.85; }
  .run-btn:disabled{ background: var(--ink-faint); border-color: var(--ink-faint); cursor: default; }
  .consent{
    display:flex; gap: 9px; align-items: flex-start; margin-top: 16px;
    font-size: 12px; color: var(--ink-faint); line-height: 1.5;
  }
  .consent input{ margin-top: 2px; accent-color: var(--moss); flex: none; }
  .run-meta{
    display:flex; justify-content: space-between; margin-top: 12px;
    font-family: var(--mono); font-size: 11px; color: var(--ink-faint);
  }

  /* --- trace panel (theme-aware: paper in light, dark in dark) --- */
  .trace-body{
    flex:1; background: var(--paper); font-family: var(--mono); font-size: 12.5px;
    padding: 20px 22px; overflow-y: auto; max-height: 560px; min-height: 560px;
    color: var(--ink-soft);
  }
  .trace-line{ padding: 8px 0; border-bottom: 1px solid var(--line); }
  .trace-line:last-child{ border-bottom:none; }
  .trace-line .t{ color: var(--ink-faint); margin-right: 10px; }
  .trace-line .tag{
    margin-right: 10px; text-transform: uppercase; font-size: 10.5px;
    letter-spacing: 0.03em; color: var(--ink-faint);
  }
  .trace-line .msg{ color: var(--ink-soft); }
  .trace-line .msg b{ color: var(--ink); font-weight: 500; }
  .trace-line .msg .sel{ color: var(--moss); }
  .trace-line.done .tag{ color: var(--moss); }
  .trace-line.fail .tag{ color: #a04b4b; }
  .trace-line.fail .msg{ color: #a04b4b; }
  html[data-theme="dark"] .trace-line.fail .tag,
  html[data-theme="dark"] .trace-line.fail .msg{ color: #c98a8a; }
  .trace-empty{
    color: var(--ink-faint); display:flex; align-items:center; justify-content:center;
    height: 100%; text-align:center; font-family: var(--sans); font-size: 13px; line-height: 1.6;
  }
  .fineprint{ margin-top: 22px; font-size: 12px; color: var(--ink-faint); line-height: 1.7; }
  .foot-note{ margin-top: 26px; font-size: 12.5px; color: var(--ink-faint); }
  .foot-note a{ color: var(--moss); }
</style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-name">Agentalyze</span>
        <span class="brand-tag">live demo</span>
      </div>
      <div class="topbar-right">
        <div class="lang-switch">
          <span id="lang_ru" class="active">RU</span>
          <span id="lang_en">EN</span>
        </div>
        <button class="theme-toggle" id="themeToggle">тёмная тема</button>
      </div>
    </div>
  </div>

  <div class="wrap">

    <div class="hero-grid">
      <div class="hero">
        <div class="kicker" data-i18n="kicker"></div>
        <h1 data-i18n="h1"></h1>
        <p class="lede" data-i18n="lede"></p>
        <div class="status-line" id="live_box">
          <span class="dot"></span>
          <span id="live_status" data-i18n="status_checking"></span>
          <span id="rate_note"></span>
        </div>
      </div>

      <div class="hero-preview">
        <div class="hero-preview-head">
          <span class="label" data-i18n="preview_label"></span>
          <span class="rec" data-i18n="preview_rec"></span>
        </div>
        <div class="hero-preview-body" id="heroPreview"></div>
        <div class="hero-preview-foot" data-i18n="preview_foot"></div>
      </div>
    </div>

    <div class="trust">
      <div class="trust-head" data-i18n="notice_title"></div>
      <ul class="trust-list">
        <li data-i18n="notice_1"></li>
        <li data-i18n="notice_2"></li>
        <li data-i18n="notice_3"></li>
        <li data-i18n="notice_4"></li>
      </ul>
    </div>

    <div class="console-label" data-i18n="console_label"></div>
    <div class="console">
      <!-- LEFT: configuration -->
      <div class="panel">
        <div class="panel-head" data-i18n="panel_config"></div>
        <div class="panel-body">

          <div class="field">
            <label for="base_url" data-i18n="label_endpoint"></label>
            <select id="base_url">
              <option value="https://openrouter.ai/api/v1" selected>OpenRouter (openrouter.ai)</option>
              <option value="https://api.openai.com/v1">OpenAI (api.openai.com)</option>
              <option value="custom" data-i18n="option_custom"></option>
            </select>
            <input type="url" id="base_url_custom" placeholder="https://…/v1" style="display:none;margin-top:8px">
            <div class="hint" data-i18n="hint_endpoint"></div>
          </div>

          <div class="field">
            <label for="model" data-i18n="label_model"></label>
            <input type="text" id="model" value="openai/gpt-4o-mini" autocomplete="off" spellcheck="false">
            <div class="hint" data-i18n="hint_model"></div>
          </div>

          <div class="field">
            <label for="api_key" data-i18n="label_key"></label>
            <div class="key-field">
              <input type="password" id="api_key" placeholder="sk-or-v1-xxxxxxxxxxxxxxxx" autocomplete="new-password" spellcheck="false">
              <button type="button" class="toggle" id="key_toggle">show</button>
            </div>
            <div class="hint" data-i18n="hint_key"></div>
          </div>

          <div class="field">
            <label for="task_select" data-i18n="label_tasks"></label>
            <select id="task_select">
              <option value="" selected disabled data-i18n="tasks_loading"></option>
            </select>
            <textarea class="task-input" id="custom_instructions" rows="3" maxlength="500" spellcheck="false" data-i18n-ph="custom_placeholder"></textarea>
            <div class="hint" id="task_hint"></div>
          </div>

          <div class="consent">
            <input type="checkbox" id="consent">
            <span data-i18n="consent_text"></span>
          </div>

          <button class="run-btn" id="run" disabled data-i18n="btn_run"></button>
          <div class="run-meta">
            <span data-i18n="meta_steps"></span>
            <span data-i18n="meta_cost"></span>
          </div>
        </div>
      </div>

      <!-- RIGHT: live trace -->
      <div class="panel">
        <div class="panel-head" data-i18n="panel_trace"></div>
        <div class="trace-body" id="result">
          <div class="trace-empty" data-i18n="trace_empty"></div>
        </div>
      </div>
    </div>

    <p class="fineprint">
      <span data-i18n="fineprint_cold"></span><br>
      <span data-i18n="fineprint_ollama"></span>
    </p>

    <p class="foot-note">
      <span data-i18n="foot"></span> ·
      <a href="https://github.com/Ilyat9/Agentalyze" target="_blank" rel="noopener">GitHub</a>
    </p>

  </div>

<script>
"use strict";
var I18N = {
  ru: {
    kicker: "browser agent runtime",
    h1: "Запусти браузерного агента на своём API-ключе",
    lede: "Настоящий headless Chromium выполняет задачу на тестовом сайте, решения принимает твоя модель. Демо работает на ключе OpenRouter или другого OpenAI-совместимого провайдера.",
    panel_config: "Конфигурация запуска",
    panel_trace: "Трейс агента",
    console_label: "конфигурация и трейс",
    notice_title: "Как обрабатывается твой API-ключ",
    notice_1: "Ключ отправляется по <code>HTTPS</code> только при нажатии «Запустить». В браузере не сохраняется: ни <code>localStorage</code>, ни cookies.",

    notice_4: "Вызовы модели оплачиваются с твоего аккаунта. Задачи ограничены <strong>8 шагами</strong>, стоимость доли цента.",
    status_checking: "проверяю сервер…",
    status_up: "сервер активен — готов к запускам",

    rate_limit_label: "лимит:",

      { t: "02.4s", tag: "act", html: "Клик по <span class=\"sel\">nav a[href*=\"pricing\"]</span>" },

    ],
    notice_5: "Первый запуск после простоя может занять до минуты, потому что бесплатный хостинг «просыпается» по запросу.",
    notice_6: "Работают только облачные OpenAI-совместимые эндпоинты. <code>Ollama</code> недоступна анонимному серверу.",
    label_endpoint: "Эндпоинт провайдера",
    option_custom: "Кастомный URL",
    hint_endpoint: "Только облачные OpenAI-совместимые эндпоинты.",
    label_model: "Модель",
    hint_model: "Например <code>openai/gpt-4o-mini</code>. Нужен tool-calling.",
    label_key: "API-ключ",
    hint_key: "Передаётся один раз по HTTPS. Не сохраняется ни на клиенте, ни на сервере.",
    label_tasks: "Задача для агента",
    tasks_loading: "Загрузка…",
    tasks_error: "Не удалось загрузить список задач.",
    custom_option: "Своя задача — описать словами…",
    custom_placeholder: "Например: найди на странице ссылку «Privacy Policy» и перейди по ней",
    custom_hint: "Выполняется на той же тестовой странице портала. Максимум 500 символов.",

    btn_run: "Запустить агента",
    meta_steps: "лимит 8 шагов",
    meta_cost: "доли цента за прогон",

/* ---------- theme ---------- */
var themeToggle = document.getElementById("themeToggle");
function themeLabel(){ themeToggle.textContent = t(document.documentElement.getAttribute("data-theme") === "dark" ? "theme_light" : "theme_dark"); }
themeToggle.addEventListener("click", function(){
  var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("agentalyze-theme", next); } catch (e) {}
  themeLabel();
});
(function(){
  var saved = null;
  try { saved = localStorage.getItem("agentalyze-theme"); } catch (e) {}
  var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  if ((saved || (prefersDark ? "dark" : "light")) === "dark") {
    document.documentElement.setAttribute("data-theme", "dark");
  }
})();

/* ---------- i18n ---------- */
var lang = "ru";
try { lang = localStorage.getItem("demo_lang") === "en" ? "en" : "ru"; } catch (e) {}
var tasksData = [];
var lastData = null;
var customText = "";

function t(key){ return I18N[lang][key]; }

function applyLang(){
  document.documentElement.lang = lang;
  document.getElementById("lang_ru").className = lang === "ru" ? "active" : "";
  document.getElementById("lang_en").className = lang === "en" ? "active" : "";
  var els = document.querySelectorAll("[data-i18n]");
  for (var i = 0; i < els.length; i++) {
    var key = els[i].getAttribute("data-i18n");
    if (t(key) != null) { els[i].innerHTML = t(key); }
  }
  var phs = document.querySelectorAll("[data-i18n-ph]");
  for (var j = 0; j < phs.length; j++) {
    var pk = phs[j].getAttribute("data-i18n-ph");
    if (t(pk) != null) { phs[j].setAttribute("placeholder", t(pk)); }
  }
  document.getElementById("key_toggle").textContent = "show";
  themeLabel();
  renderTasks();
  playHeroPreview();
  if (lastData) { render(lastData); }
}

document.getElementById("lang_ru").addEventListener("click", function(){ lang = "ru"; try { localStorage.setItem("demo_lang","ru"); } catch(e){} applyLang(); });
document.getElementById("lang_en").addEventListener("click", function(){ lang = "en"; try { localStorage.setItem("demo_lang","en"); } catch(e){} applyLang(); });

/* ---------- form ---------- */
var consent = document.getElementById("consent");
var runBtn = document.getElementById("run");
var resultBox = document.getElementById("result");
var sel = document.getElementById("base_url");
var customUrl = document.getElementById("base_url_custom");
var taskSelect = document.getElementById("task_select");
var customTa = document.getElementById("custom_instructions");

sel.addEventListener("change", function(){
  customUrl.style.display = sel.value === "custom" ? "block" : "none";
});

document.getElementById("key_toggle").addEventListener("click", function(){
  var input = document.getElementById("api_key");
  var showing = input.type === "text";
  input.type = showing ? "password" : "text";
  this.textContent = showing ? "show" : "hide";
});

function selectedTask(){ return taskSelect.value || null; }

function refresh(){
  var task = selectedTask();
  var ok = consent.checked && !!task;
  if (ok && task === "custom") { ok = customTa.value.trim().length > 0; }
  runBtn.disabled = !ok;
}
consent.addEventListener("change", refresh);
customTa.addEventListener("input", refresh);
taskSelect.addEventListener("change", function(){
  customTa.style.display = taskSelect.value === "custom" ? "block" : "none";
  var desc = (I18N[lang].task_descriptions || {})[taskSelect.value];
  document.getElementById("task_hint").textContent = desc || (taskSelect.value === "custom" ? t("custom_hint") : "");
  refresh();
});

function renderTasks(){
  var ta = document.getElementById("custom_instructions");
  if (ta) { customText = ta.value; }
  var prev = taskSelect.value;
  taskSelect.innerHTML = "";
  tasksData.forEach(function (task) {
    var opt = document.createElement("option");
    opt.value = task.id;
    opt.textContent = (I18N[lang].tasks || {})[task.id] || task.title;
    taskSelect.appendChild(opt);
  });
  var customOpt = document.createElement("option");
  customOpt.value = "custom";
  customOpt.textContent = t("custom_option");
  taskSelect.appendChild(customOpt);
  // Restore the previous selection only if it is a REAL task, or a custom
  // task the visitor has actually typed into. Never auto-select "custom":
  // an early render (before /demo/tasks resolves) must not strand the form
  // on a disabled-by-empty state. Default to the first allowlisted task.
  var restore;
  if (prev === "custom" && customText) {
    restore = "custom";
  } else if (tasksData.some(function (tk) { return tk.id === prev; })) {
    restore = prev;
  } else {
    restore = tasksData.length ? tasksData[0].id : "";
  }
  if (restore) { taskSelect.value = restore; }
  customTa.style.display = taskSelect.value === "custom" ? "block" : "none";
  taskSelect.dispatchEvent(new Event("change"));
}

fetch("/demo/tasks").then(function (r) { return r.json(); }).then(function (data) {
  tasksData = data.tasks || [];
  renderTasks();
  if (data.rate_limit) {
    document.getElementById("rate_note").textContent = " · " + t("rate_limit_label") + " " + data.rate_limit;
  }
}).catch(function () {
  document.getElementById("task_hint").textContent = t("tasks_error") || "";
});

/* ---------- honest live status (real /livez, no fake counters) ---------- */
function setLive(mode, key) {
  var box = document.getElementById("live_box");
  box.className = "status-line " + mode;
  document.getElementById("live_status").textContent = t(key);
}
function checkLive() {
  setLive("", "status_checking");
  fetch("/livez", { cache: "no-store" }).then(function (r) {
    if (r.ok) { setLive("up", "status_up"); }
    else { wakingLive(); }
  }).catch(wakingLive);
}
function wakingLive() {
  setLive("warn", "status_waking");
  setTimeout(function () {
    fetch("/livez", { cache: "no-store" }).then(function (r) {
      if (r.ok) { setLive("up", "status_up"); }
    }).catch(function () {});
  }, 5000);
}
checkLive();

/* ---------- looping hero preview: illustrative demo loop, clearly labeled ---------- */
var previewTimer = null;
function playHeroPreview() {
  var el = document.getElementById("heroPreview");
  if (!el) { return; }
  if (previewTimer) { clearInterval(previewTimer); }
  var steps = I18N[lang].preview_steps || [];
  el.innerHTML = "";
  steps.forEach(function (s, i) {
    setTimeout(function () {
      var line = document.createElement("div");
      line.className = "hero-preview-line";
      line.innerHTML = '<span class="t">' + s.t + '</span><span class="tag">' + s.tag + "</span>" + s.html;
      el.appendChild(line);
    }, i * 480);
  });
  previewTimer = setInterval(function () { playHeroPreview(); }, steps.length * 480 + 2400);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

/* ---------- run ---------- */
runBtn.addEventListener("click", function () {
  var key = document.getElementById("api_key").value.trim();
  var model = document.getElementById("model").value.trim();
  var base = sel.value === "custom" ? customUrl.value.trim() : sel.value;
  var task = selectedTask();
  if (!key || !model || !task) { return; }

  var body = {
    provider_kind: "openai_compatible",
    base_url: base,
    api_key: key,
    model_name: model,
    task_id: task
  };
  if (task === "custom") { body.custom_instructions = customTa.value.trim(); }

  runBtn.disabled = true;
  lastData = null;
  resultBox.innerHTML = '<div class="trace-line"><span class="t">…</span>' +
    '<span class="tag">run</span><span class="msg">' + escapeHtml(t("running")) + "</span></div>";
  resultBox.scrollTop = 0;

  fetch("/demo/run", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  }).then(function (r) {
    return r.json().then(function (data) { return { data: data }; });
  }).then(function (res) {
    lastData = res.data;
    render(res.data);
  }).catch(function (err) {
    resultBox.innerHTML = traceLine("", "error", t("network_err") + String(err), false);
  }).finally(function () {
    runBtn.disabled = !consent.checked;
    document.getElementById("api_key").value = "";
  });
});

function traceLine(ts, tag, msgHtml, done, fail) {
  return '<div class="trace-line' + (done ? " done" : "") + (fail ? " fail" : "") + '">' +
    '<span class="t">' + ts + "</span>" +
    '<span class="tag">' + escapeHtml(tag) + "</span>" +
    '<span class="msg">' + msgHtml + "</span></div>";
}

function pad2(n) { return (n < 10 ? "0" : "") + n; }

function render(data) {
  var html = "";
  if (data.status === "completed" || data.status === "failed") {
    var good = data.status === "completed";
    var outcomeText = (I18N[lang].outcomes || {})[data.outcome] || data.outcome;
    html += traceLine("", good ? "done" : "fail",
      "<b>" + escapeHtml((good ? t("st_completed") : t("st_failed")) + t("outcome_prefix") + outcomeText) + "</b>",
      good, !good);
    var meta = (data.step_count + " · " + data.wall_clock_seconds + "s · " +
      t("stats_tokens_fmt").replace("{i}", data.total_prompt_tokens).replace("{o}", data.total_completion_tokens) +
      (data.total_cost_usd != null ? " · $" + data.total_cost_usd.toFixed(4) : ""));
    html += traceLine("", "meta", escapeHtml(meta), false, false);
    if (data.verifier_reason) {
      html += traceLine("", "verifier", escapeHtml(data.verifier_reason), false, false);
    }
    if (data.task_id === "custom") {
      html += traceLine("", "note", escapeHtml(t("custom_note")), false, false);
    }
    (data.steps || []).forEach(function (s) {
      var msg = escapeHtml(s.observation || "");
      if (s.ok === false) { msg = '<span class="sel">✗</span> ' + msg; }
      html += traceLine(pad2(s.step), s.action, msg, false, s.ok === false);
    });
    resultBox.innerHTML = html;
    resultBox.scrollTop = 0;
  } else {
    var msg;
    if (data.status === "timeout") {
      msg = t("timeout_msg").replace("{n}", data.timeout_seconds || "90");
    } else if (data.error_kind) {
      var kindMap = {
        provider_auth: "err_auth",
        provider_timeout: "err_timeout",
        provider_connection: "err_connection",
        provider_error: "err_provider"
      };
      msg = kindMap[data.error_kind] ? t(kindMap[data.error_kind]) : (data.message || "");
    } else {
      msg = data.message || data.detail || JSON.stringify(data);
    }
    var statusKey = { timeout: "st_timeout", error: "st_error" }[data.status] || "st_error";
    resultBox.innerHTML =
      traceLine("", "fail", "<b>" + escapeHtml(t(statusKey)) + "</b>", false, true) +
      traceLine("", "error", escapeHtml(msg), false, true);
  }
}

applyLang();
</script>
