# Alembic configuration for Agentalyze service-mode schema.
#
# The sqlalchemy.url here is a FALLBACK only: the application sets the URL
# programmatically (from AGENTALYZE_DATABASE_URL, translated to a sync driver)
# before invoking Alembic, so deployments never edit this file.

[alembic]
script_location = migrations
prepend_sys_path = src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
