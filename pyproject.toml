[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentalyze"
version = "0.1.0"
description = "Eval harness for LLM agents working with tools and a real browser."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
authors = [{ name = "Agentalyze contributors" }]
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    # Pinned <3 on purpose: openai 3.x switched to a vendored httpx fork
    # ("httpx2"), which breaks HTTP-level mocking (respx) and changes the
    # transport behavior the provider layer relies on.
    "openai>=1.40,<3",
    "tenacity>=8.2",
    "PyYAML>=6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.21",
    "types-PyYAML",
    "types-Markdown",
]
browser = [
    "playwright>=1.45",
]
# HTTP service mode (`agentalyze serve`): entirely optional — the pure CLI
# never needs any of these. Install with `pip install -e ".[api]"`.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "slowapi>=0.1.10",
    "structlog>=24",
    "prometheus-client>=0.20",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    # PostgreSQL driver for production deployments (SQLite default is for
    # single-host dev/self-hosted; see docs/DEPLOYMENT.md).
    "asyncpg>=0.29",
    "alembic>=1.13",
    "markdown>=3.5",
]
# Load testing for the API (docs/DEPLOYMENT.md): locust only.
loadtest = [
    "locust>=2.20",
]


[project.scripts]
agentalyze = "agentalyze.runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "browser: requires a real Chromium install (pip install -e \".[browser]\" && playwright install chromium); excluded from the default run — opt in with `pytest -m browser`",
    "requires_ollama: requires a real Ollama server on localhost:11434; excluded from the default run — opt in with `pytest -m requires_ollama`",
    "e2e_live: full end-to-end run with a REAL model + real Chromium; the slowest, rarest test — opt in with `pytest -m e2e_live`",
]
addopts = "-m 'not browser and not requires_ollama and not e2e_live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true