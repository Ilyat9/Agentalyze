# =============================================================================
# Полноценный CI. Четыре параллельных job'а на каждый push/PR:
#
#   lint          — ruff + mypy strict (оба блокирующие)
#   test-fast     — все быстрые тесты, без браузера и внешних сервисов
#   test-browser  — тесты с реальным Chromium (кэш браузеров между запусками)
#   docker-build  — сборка образа + smoke-тест CLI
#
# Осознанно НЕТ автоматического job'а с платным облачным LLM API: он требует
# секретов в репозитории и стоит денег на каждый PR. Вместо этого есть ручной
# job `e2e-live-manual` — только по workflow_dispatch.
#
# Про маркеры: pytest-маркеры проекта — `browser`, `requires_ollama`,
# `e2e_live` (заданы в pyproject.toml). Быстрые тесты =
# "not browser and not requires_ollama and not e2e_live" (это ещё и addopts
# по умолчанию; здесь прописано явно для наглядности). Тест e2e_live несёт
# ОБА маркера (browser + e2e_live), поэтому browser-job обязан явно исключить
# e2e_live, иначе он потянет реальную модель.
#
# Про mypy: pyproject.toml содержит strict = true, и весь код ему соответствует
# (`mypy src` — блокирующий шаг job'а `lint`).
#
# Про extras: playwright живёт в extra [browser], но импортируется на уровне
# модулей (runner, verifiers), поэтому lint и test-fast ставят [dev,browser] —
# иначе mypy не найдёт типы playwright, а сборка тестов упадёт на import.
# Сам Chromium-бинарник этим job'ам не нужен (это extra [browser] только
# python-пакет; бинарник ставит `playwright install` лишь test-browser).
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Нужен ТОЛЬКО чтобы стал доступен ручной e2e-live-manual ниже;
  # обычные push/PR он не затрагивает.
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with dev + browser extras
        # [browser] нужен здесь не для запуска браузера, а чтобы mypy видел
        # типы playwright (модули runner/verifiers импортируют его напрямую).
        run: pip install -e ".[dev,browser,api]" types-PyYAML

      - name: Ruff
        run: ruff check .

      - name: Mypy (strict, blocking)
        run: mypy src

  # ---------------------------------------------------------------------------
  test-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with dev + browser extras
        # Без [browser] сборка тестов падает: даже небраузерные тесты
        # импортируют agentalyze.runner, а тот на уровне модуля тянет playwright.
        run: pip install -e ".[dev,browser,api]"

      - name: Run fast tests (no browser, no external services)
        run: pytest -m "not browser and not requires_ollama and not e2e_live"

  # ---------------------------------------------------------------------------
  test-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with browser extra
        run: pip install -e ".[dev,browser,api]"

      - name: Resolve Playwright version (cache key component)
        id: pw-version
        run: echo "version=$(pip show playwright | awk '/^Version:/ {print $2}')" >> "$GITHUB_OUTPUT"

      # Chromium-бинарники весят десятки мегабайт — кэшируем каталог, куда
      # их ставит `playwright install`, между запусками CI.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}

      - name: Install Chromium
        run: playwright install --with-deps chromium

      # Реальный Chromium, но БЕЗ реальных моделей: валидация фикстур задач и
      # browser-инструментов раннера. Всё, что зовёт живого
      # провайдера (e2e_live), исключено; провайдерная логика покрыта
      # FakeProvider-ами из тестов в job'е test-fast.
      - name: Run browser tests
        run: pytest -m "browser and not e2e_live"

  # ---------------------------------------------------------------------------
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t agentalyze:ci .

      - name: Smoke test — CLI help prints and exits cleanly
        run: |
          OUTPUT="$(docker run --rm agentalyze:ci --help)"
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -qi "usage\|agentalyze"

      - name: Smoke test — task registry loads inside the container
        run: |
          OUTPUT="$(docker run --rm agentalyze:ci tasks)"
          echo "$OUTPUT"
          # CLI печатает "N registered task(s)" — паттерн без финальной 's'.
          echo "$OUTPUT" | grep -q "registered task"

      - name: Smoke test — service mode boots and answers probes
        run: |
          # SQLite в /tmp: /app недоступна на запись под pwuser.
          docker run -d --name agt-smoke \
            -e AGENTALYZE_DATABASE_URL=sqlite+aiosqlite:////tmp/svc.db \
            agentalyze:ci serve --host 0.0.0.0 --port 8000
          sleep 8
          docker exec agt-smoke python -c "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/livez', timeout=5); assert r.status==200; r2=urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5); assert r2.status==200; print('service smoke OK')"
          docker rm -f agt-smoke

  # ---------------------------------------------------------------------------
  # РУЧНОЙ честный end-to-end прогон с настоящим платным провайдером.

  # Никогда не выполняется на push/pull_request — только по запросу
  # (Actions -> CI -> Run workflow). Требует секрет OPENROUTER_API_KEY.
  # ---------------------------------------------------------------------------
  e2e-live-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with browser extra + Chromium
        run: |
          pip install -e ".[browser]" types-PyYAML
          playwright install chromium

      - name: Write throwaway providers.yaml
        run: |
          cat > providers.yaml <<'EOF'
          providers:
            - name: gpt-4o-mini-via-openrouter
              kind: openai_compatible
              base_url: https://openrouter.ai/api/v1
              api_key_env_var: OPENROUTER_API_KEY
              model_name: openai/gpt-4o-mini
          EOF

      - name: One real task, one real model, real Chromium
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: agentalyze run --task nav-simple-link-01 --provider gpt-4o-mini-via-openrouter

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-live-run
          path: results/
