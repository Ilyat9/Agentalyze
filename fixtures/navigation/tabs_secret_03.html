<!DOCTYPE html>
<!-- nav-tabs-secret-03: five similar tabs, only 'Archive' reveals the secret panel.
     Success marker: #secret-panel[data-opened="true"] -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workspace Settings</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; }
  .tab { margin-right: .25rem; padding: .4rem 1rem; }
  .tab.active { font-weight: bold; }
  .panel { border-top: 1px solid #ddd; padding-top: 1rem; }
</style>
</head>
<body>
<h1>Workspace Settings</h1>
<div role="tablist">
  <button class="tab" data-tab-id="tab-profile">Profile</button>
  <button class="tab" data-tab-id="tab-billing">Billing</button>
  <button class="tab" data-tab-id="tab-archive">Archive</button>
  <button class="tab" data-tab-id="tab-archived">Archived Users</button>
  <button class="tab" data-tab-id="tab-archives">Archives API</button>
</div>
<div class="panel" id="panel-profile"><p>Profile settings.</p></div>
<div class="panel" id="panel-secret" data-opened="false" hidden>
  <p>Secret archive panel unlocked.</p>
</div>
<script>
  document.querySelectorAll('.tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      document.querySelectorAll('.panel').forEach(function (p) { p.hidden = true; });
      if (tab.dataset.tabId === 'tab-archive') {
        var secret = document.getElementById('panel-secret');
        secret.hidden = false;
        secret.dataset.opened = 'true';
      } else {
        // decoy panels reuse generic content
        var p = document.getElementById('panel-profile');
        p.hidden = false;
        p.textContent = 'Panel "' + tab.textContent + '" is empty.';
      }
    });
  });
</script>
</body>
</html>
