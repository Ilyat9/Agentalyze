# Managed-сервис PostgreSQL предпочтителен в проде; этот StatefulSet —
# самодостаточный вариант для кластера без managed-БД.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: agentalyze
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: agentalyze
            - name: POSTGRES_DB
              value: agentalyze
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentalyze-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - name: pg
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: agentalyze
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: pg
      port: 5432
