apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentalyze-api
  namespace: agentalyze
  labels:
    app: agentalyze-api
spec:
  replicas: 1
  # Rolling update = zero-downtime: новый под получает трафик только после
  # того, как readinessProbe убедится в подключении к БД.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: agentalyze-api
  template:
    metadata:
      labels:
        app: agentalyze-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: agentalyze:latest
          imagePullPolicy: IfNotPresent
          command: ["agentalyze"]
          args: ["serve", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: agentalyze-config
          env:
            - name: AGENTALYZE_DATABASE_URL
              value: postgresql+asyncpg://agentalyze:$(POSTGRES_PASSWORD)@postgres:5432/agentalyze
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentalyze-secrets
                  key: POSTGRES_PASSWORD
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agentalyze-secrets
                  key: OPENROUTER_API_KEY
                  optional: true
          resources:
            # Каждый in-flight combination держит реальный Chromium — memory
            # budget задаётся с запасом на max_active_suite_runs браузеров.
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          readinessProbe:
            # Готов принимать трафик ТОЛЬКО когда БД доступна (lifespan уже
            # накатил миграции и движок инициализирован).
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          startupProbe:
            # Первый старт включает накат миграций — даём до 2 минут.
            httpGet:
              path: /livez
              port: http
            failureThreshold: 12
            periodSeconds: 10
          volumeMounts:
            - name: results
              mountPath: /app/results
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: agentalyze-results
---
apiVersion: v1
kind: Service
metadata:
  name: agentalyze-api
  namespace: agentalyze
spec:
  selector:
    app: agentalyze-api
  ports:
    - name: http
      port: 80
      targetPort: http
